<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimRacing Fahrzeug-Filter</title>
    <!-- Verknüpfung zur externen CSS-Datei -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <!-- HAUPT-LAYOUT CONTAINER -->
    <div class="layout-container">
        
        <!-- LINKE SPALTE: LOGO UND DROPDOWNS -->
        <aside class="left-sidebar">

<!-- Überarbeitete Fahrerkarte in der Sidebar -->
<div id="driver-info-box" class="driver-meta-info">
    <div class="driver-profile-top">
        <img id="driver-avatar" src="" alt="Avatar" style="display: none;">
        <h2 id="driver-name">Wird geladen...</h2>
    </div>
    <hr class="profile-divider">
    
    <div class="driver-meta-item">
        <span class="meta-label">👤 Team:</span>
        <span id="info-team" class="meta-value">-</span>
    </div>
    <div class="driver-meta-item">
        <span class="meta-label">🎖️ Rank:</span>
        <span id="info-rank" class="meta-value">-</span>
    </div>
    <div class="driver-meta-item">
        <span class="meta-label">🆔 User ID:</span>
        <span id="info-userid" class="meta-value">-</span>
    </div>
    <div class="driver-meta-item">
        <span class="meta-label">🌐 Nation:</span>
        <span id="info-nation" class="meta-value">
            <img id="country-flag" src="" alt="Flagge" style="display: none; width: 18px; height: auto; border-radius: 2px; vertical-align: middle; margin-right: 6px;">
            <span id="country-name">-</span>
        </span>
    </div>
</div>


    <div class="logo-container">
        <img id="serien-logo" src="" alt="Serien-Logo" style="display: none;">
    </div>
    
    <!-- 🚀 NEU: Box für Rennlänge und Pitstop direkt unter dem Logo -->
    <div id="series-meta-box" class="series-extra-info" style="display: none;">
        <div class="meta-item">🏁 <strong>Länge:</strong> <span id="info-laenge">-</span></div>
        <div class="meta-item">⛽ <strong>Pitstop:</strong> <span id="info-pitstop">-</span></div>
    </div>
    
   
            
            <div class="filter-group">
                <label for="filter-serie">Rennserie</label>
                <select id="filter-serie">
                    <option value="all">Alle Serien</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filter-class">Klasse</label>
                <select id="filter-class" disabled>
                    <option value="all">Alle Klassen</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filter-brand">Hersteller (Brand)</label>
                <select id="filter-brand" disabled>
                    <option value="all">Alle Hersteller</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-track">Strecke</label>
                <select id="filter-track" disabled>
                    <option value="all">Alle Strecken</option>
                </select>
            </div>


<div class="sidebar-license-box">
    <div class="license-wrapper">
        <img src="Fahrer/DriverID.png" alt="Fahrerlizenz" class="license-card-img">
        <img id="license-avatar" src="" alt="Fahrer Foto" style="display: none;">
        <span id="license-number-text">-</span>
        
        <!-- Die drei Textzeilen auf der linken Kartenseite -->
        <span id="license-lastname-text" class="license-field">-</span>
        <span id="license-firstname-text" class="license-field">-</span>
        <span id="license-login-text" class="license-field">-</span>
	<!-- NEU: Dynamische Landesflagge über der aufgedruckten Flagge -->
        <img id="license-country-flag" src="" alt="Landesflagge" style="display: none;">
	<span id="license-rank-text">-</span>

    </div>
</div>

        </aside>


        <!-- MITTLERE SPALTE: DYNAMISCHE ERGEBNISSE -->
        <main class="main-content">
            <div class="car-grid" id="car-container">
                <!-- Deine app.js befüllt diesen Bereich automatisch mit den Fahrzeugen -->
            </div>
        </main>

        <!-- RECHTE SPALTE: RENNKALENDER (RENNEN 1-6) -->
        <aside class="right-sidebar">
            <div class="schedule-title">Rennkalender</div>
            
            <div class="rounds-list">
                <!-- RENNEN 1 -->
                <div class="round-card active">
                    <div class="track-layout-mini">
                        <img src="https://r3eassets.com" alt="Rennen 1">
                    </div>
                    <div class="round-info">
                        <span class="round-number">RENNEN 1</span>
                        <span class="track-name">Wird geladen...</span>
                    </div>
                </div>

                <!-- RENNEN 2 -->
                <div class="round-card">
                    <div class="track-layout-mini">
                        <img src="https://r3eassets.com" alt="Rennen 2">
                    </div>
                    <div class="round-info">
                        <span class="round-number">RENNEN 2</span>
                        <span class="track-name">Wird geladen...</span>
                    </div>
                </div>

                <!-- RENNEN 3 -->
                <div class="round-card">
                    <div class="track-layout-mini">
                        <img src="https://r3eassets.com" alt="Rennen 3">
                    </div>
                    <div class="round-info">
                        <span class="round-number">RENNEN 3</span>
                        <span class="track-name">Wird geladen...</span>
                    </div>
                </div>

                <!-- RENNEN 4 -->
                <div class="round-card">
                    <div class="track-layout-mini">
                        <img src="https://r3eassets.com" alt="Rennen 4">
                    </div>
                    <div class="round-info">
                        <span class="round-number">RENNEN 4</span>
                        <span class="track-name">Wird geladen...</span>
                    </div>
                </div>

                <!-- RENNEN 5 -->
                <div class="round-card">
                    <div class="track-layout-mini">
                        <img src="https://r3eassets.com" alt="Rennen 5">
                    </div>
                    <div class="round-info">
                        <span class="round-number">RENNEN 5</span>
                        <span class="track-name">Wird geladen...</span>
                    </div>
                </div>

                <!-- RENNEN 6 -->
                <div class="round-card">
                    <div class="track-layout-mini">
                        <img src="https://r3eassets.com" alt="Rennen 6">
                    </div>
                    <div class="round-info">
                        <span class="round-number">RENNEN 6</span>
                        <span class="track-name">Wird geladen...</span>
                    </div>
                </div>

            </div>
        </aside>
    </div>

    <!-- JAVASCRIPT BLOCK -->
    <script src="app.js"></script>
</body>
</html>
